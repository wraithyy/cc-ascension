name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check scripts
        run: |
          node --check scripts/mine.mjs
          node --check scripts/friction.mjs
          bash -n scripts/install-backup.sh
      - name: Test miner
        run: node --test scripts/mine.test.mjs
      - name: Validate manifests are JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json'))"
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json'))"
      - name: Validate plugin with Claude Code CLI
        run: npx --yes @anthropic-ai/claude-code plugin validate .
